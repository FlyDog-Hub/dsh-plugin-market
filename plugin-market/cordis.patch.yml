# dsh-market — bundle patch layer.
#
# 这是本包的 `dsh.bundle.patch` 层。装进 profile（`dsh plugin --profile <name> add <path>`）
# 后，Loader 会把下面这一行 insert 进该 profile 的根条目列表，市场才会被装载。
#
# `inject` 必须写：它让 Cordis 等到 webServer 服务就绪后再激活本插件。
# 少了它，apply() 可能在 webServer 存在之前跑，/plugin-market 路由注册不上，
# 客户端面板会拿到 404。
#
# pluginManager 不写在这里：它对市场是可选能力（缺少时市场降级为只读浏览），
# 由 lib/index.js 用 ctx.get('pluginManager') 在运行时判断，避免在没有插件管理器的
# 组合里让整行永远停在 pending。
- insert:
    - id: plugin-market
      name: dsh-market
      inject:
        - webServer
