<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>最小复现：flex 列里的 overflow:hidden 子项被压扁</title>
<style>
  html, body { margin: 0; height: 100%; }
  /* 与 .dshpm-root 一致：定高 + 可滚动 + flex 列 */
  #root { display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
          width: 100%; height: 100%; min-height: 0; overflow: auto; padding: 16px; }
  /* 与 .dshpm-notice 一致（含我为倒计时线加的 overflow:hidden） */
  #notice { display: flex; align-items: flex-start; gap: 8px; box-sizing: border-box;
            padding: 8px 10px; border: 1px solid #ccc; border-left: 3px solid #1f9d55;
            border-radius: 8px; font-size: .84em; position: relative; overflow: hidden; }
  #tall { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
  #tall > div { height: 180px; border: 1px solid #ddd; border-radius: 10px; }
</style>
</head>
<body>
  <div id="root">
    <div id="notice"><span>ⓘ</span><div>发现 2 个插件有新版本，点「更新插件」逐个确认。</div></div>
    <div id="tall"></div>
  </div>
<script>
  var tall = document.getElementById('tall')
  for (var i = 0; i < 24; i++) tall.appendChild(document.createElement('div'))
  window.__measure = function () {
    var root = document.getElementById('root')
    var n = document.getElementById('notice')
    return {
      rootClientHeight: root.clientHeight,
      rootScrollHeight: root.scrollHeight,
      rootScrolls: root.scrollHeight > root.clientHeight,
      noticeOffsetHeight: n.offsetHeight,
      noticeClientHeight: n.clientHeight,
      noticeScrollHeight: n.scrollHeight,
      noticeClipped: n.clientHeight < n.scrollHeight,
      noticeFlexShrink: getComputedStyle(n).flexShrink,
      noticeOverflow: getComputedStyle(n).overflow,
    }
  }
</script>
</body>
</html>
